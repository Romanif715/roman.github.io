<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бургер-Italian</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #2c2c2c;
      color: #fff;
      padding: 40px 20px;
    }

    .menu-container {
      max-width: 1100px;
      margin: 0 auto;
      background-color: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .content {
      display: flex;
      flex-wrap: wrap;
    }

    /* Ліва частина з фото */
    .left-side {
      flex: 1;
      min-width: 380px;
      position: relative;
    }

    .burger-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      padding: 30px 25px 25px;
    }

    .logo {
      background-color: #000;
      padding: 25px 30px;
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 2px;
    }

    .logo span {
      font-size: 18px;
      display: block;
      margin-top: 8px;
      font-weight: normal;
      letter-spacing: 1px;
      color: #ffcc00;
    }

    /* Права частина з меню */
    .right-side {
      flex: 1;
      min-width: 380px;
      padding: 40px 50px 40px 40px;
      background: white;
      color: #222;
    }

    .catchphrase {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 35px;
      color: #222;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px 40px;
    }

    .menu-item {
      text-align: center;
      position: relative;
    }

    /* Ромби через псевдоелементи */
    .menu-item::before,
    .menu-item::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: #222;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      z-index: 1;
    }

    .menu-item::before {
      left: -22px;
    }

    .menu-item::after {
      right: -22px;
    }

    .item-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .item-price {
      font-size: 16px;
      color: #555;
    }

    .divider {
      height: 1px;
      background: #ddd;
      margin: 12px 0;
    }

    /* Кнопка */
    .btn-all {
      display: block;
      width: 220px;
      margin: 50px auto 0;
      padding: 18px;
      background-color: #000;
      color: white;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
      transition: 0.3s;
    }

    .btn-all:hover {
      background-color: #333;
    }

    /* Адаптив */
    @media (max-width: 900px) {
      .content {
        flex-direction: column;
      }
      .right-side {
        padding: 40px 30px;
      }
    }
  </style>
</head>
<body>

  <div class="menu-container">
    <div class="content">

      <!-- Ліва частина з фото Макдональдса -->
      <div class="left-side">
        <img src="https://picsum.photos/id/1060/800/1000" 
             alt="Біг Мак з Макдональдса" 
             class="burger-img">
        
        <div class="overlay">
          <div class="logo">
            БУРГЕР-<br>ITALIAN
            <span>УСЬОГО 79 ГРН</span>
          </div>
        </div>
      </div>

      <!-- Права частина з меню -->
      <div class="right-side">
        <h2 class="catchphrase">Лови момент!</h2>

        <div class="menu-grid">

          <div class="menu-item">
            <div class="item-name">MICHIGAN</div>
            <div class="item-price">64.00 ГРН</div>
            <div class="divider"></div>
          </div>

          <div class="menu-item">
            <div class="item-name">Beef BBQ</div>
            <div class="item-price">59.00 ГРН</div>
            <div class="divider"></div>
          </div>

          <div class="menu-item">
            <div class="item-name">Cheeseburger</div>
            <div class="item-price">59.00 ГРН</div>
            <div class="divider"></div>
          </div>

          <div class="menu-item">
            <div class="item-name">KETCHUP ROOM</div>
            <div class="item-price">68.00 ГРН</div>
            <div class="divider"></div>
          </div>

          <div class="menu-item">
            <div class="item-name">KETCHUP ROOM 2</div>
            <div class="item-price">72.00 ГРН</div>
            <div class="divider"></div>
          </div>

          <div class="menu-item">
            <div class="item-name">ELVIS</div>
            <div class="item-price">55.00 ГРН</div>
            <div class="divider"></div>
          </div>

        </div>

        <a href="#" class="btn-all">ВСЕ МЕНЮ</a>
      </div>

    </div>
  </div>

</body>
</html>
