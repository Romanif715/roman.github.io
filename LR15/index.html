<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог книг</title>
  <link rel="stylesheet" href="styles/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
<main class="container">
  <h1>Каталог книг</h1>

  <section>
    <h2>Обліковий запис</h2>
    <p id="auth-status" role="status" aria-live="polite"></p>

    <div id="auth-forms">
      <form id="register-form">
        <h3>Реєстрація</h3>
        <label for="register-email">Електронна адреса</label>
        <input id="register-email" type="email" required>
        <label for="register-password">Пароль</label>
        <input id="register-password" type="password" minlength="6" required>
        <button type="submit">Зареєструватися</button>
      </form>

      <form id="login-form">
        <h3>Вхід</h3>
        <label for="login-email">Електронна адреса</label>
        <input id="login-email" type="email" required>
        <label for="login-password">Пароль</label>
        <input id="login-password" type="password" required>
        <button type="submit">Увійти</button>
      </form>
    </div>

    <div id="user-panel" hidden>
      <p id="user-info"></p>
      <button id="logout-button" type="button">Вийти</button>
    </div>
  </section>

  <section>
    <h2>Список книг</h2>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="books-list"></ul>
  </section>

  <section id="admin-panel" hidden>
    <h2>Адміністративна частина</h2>
    <p id="form-status" role="status" aria-live="polite"></p>
    <form id="book-form">
      <input id="book-id" type="hidden">
      <label for="title">Назва книги</label>
      <input id="title" required maxlength="150">
      <label for="author">Автор</label>
      <input id="author" required maxlength="150">
      <button id="save-button" type="submit">Додати книгу</button>
      <button id="cancel-button" type="button" hidden>Скасувати редагування</button>
    </form>
  </section>
</main>
</body>
</html>
