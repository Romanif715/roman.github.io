<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Дитячі іграшки</title>

<style>
body {
    font-family: Arial;
    text-align: center;
}

.container {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.card {
    border: 1px solid #ccc;
    width: 200px;
    padding: 10px;
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: contain;
}

button {
    background: rgb(137, 146, 230);
    border: none;
    padding: 10px;
    cursor: pointer;
}
</style>

</head>
<body>

<h2>Онлайн замовлення</h2>

<div class="container">

    <div class="card">
        <h4>М'які іграшки</h4>
        <img src="Ведмедик.png">
        <p>Ведмедик</p>
        <p>300 грн</p>
        <a href="https://rozetka.com.ua/ua/search/?text=ведмедик">
            <button>У корзину</button>
        </a>
    </div>

    <div class="card">
        <h4>Конструктор</h4>
        <img src="LEGO.png">
        <p>LEGO набір</p>
        <p>500 грн</p>
        <a href="https://rozetka.com.ua/ua/search/?text=lego">
            <button>У корзину</button>
        </a>
    </div>

    <div class="card">
        <h4>Машинки</h4>
        <img src="Іграшкова машинка.png">
        <p>Іграшкова машинка</p>
        <p>250 грн</p>
        <a href="https://rozetka.com.ua/ua/search/?text=машинка+іграшка">
            <button>У корзину</button>
        </a>
    </div>

    <div class="card">
        <h4>Розвиваючі іграшки</h4>
        <img src="Розвиваючі іграшки.png">
        <p>Кубики</p>
        <p>200 грн</p>
        <a href="https://rozetka.com.ua/ua/search/?text=кубики+дитячі">
            <button>У корзину</button>
        </a>
    </div>

</div>

<h2>Категорія товарів:</h2>
<h3>Дитячі іграшки</h3>

</body>
</html>
