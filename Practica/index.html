<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>PracticalTasks</title>
</head>
<body>
  <h2>Відкрий консоль (F12) і дивись результат</h2>

  <script>
    // ---------- ЗАВДАННЯ 3 ----------
    class Employee {
      constructor(name, position, salary, years) {
        this.name = name;
        this.position = position;
        this.salary = salary;
        this.years = years;
      }
      toString() {
        return `${this.name} (${this.position}) — ${this.salary} грн, ${this.years} років`;
      }
    }

    const employees = [
      new Employee("Олена", "Frontend Developer", 45000, 3),
      new Employee("Андрій", "Backend Developer", 52000, 5),
      new Employee("Марія", "QA Engineer", 38000, 2),
      new Employee("Ігор", "Team Lead", 75000, 8),
      new Employee("Наталія", "UI/UX Designer", 42000, 4)
    ];

    const averageSalary = (list) =>
      list.reduce((sum, e) => sum + e.salary, 0) / list.length;

    const mostExperienced = (list) =>
      list.reduce((max, e) => (e.years > max.years ? e : max));

    // ---------- ЗАВДАННЯ 4 ----------
    class Book {
      constructor(title, author, year, rating, read) {
        this.title = title;
        this.author = author;
        this.year = year;
        this.rating = rating;
        this.read = read;
      }
      toString() {
        return `"${this.title}" — ${this.author} (${this.year}) ${this.rating} ` +
               (this.read ? "[прочитано]" : "[не прочитано]");
      }
    }

    const books = [
      new Book("Clean Code", "Robert C. Martin", 2008, 4.7, true),
      new Book("Effective Java", "Joshua Bloch", 2018, 4.8, false),
      new Book("Design Patterns", "Gang of Four", 1994, 4.6, true),
      new Book("Java Concurrency in Practice", "Brian Goetz", 2006, 4.5, false),
      new Book("Head First Design Patterns", "Eric Freeman", 2004, 4.4, true),
      new Book("Refactoring", "Martin Fowler", 1999, 4.3, false),
      new Book("The Pragmatic Programmer", "Andrew Hunt", 1999, 4.7, true),
      new Book("Clean Architecture", "Robert C. Martin", 2017, 4.6, false)
    ];

    const unreadBooks = (list) =>
      list.filter(b => !b.read).map(b => b.title);

    const booksByAuthor = (list, author) =>
      list.filter(b => b.author.toLowerCase() === author.toLowerCase())
          .sort((a, b) => a.year - b.year);

    const topRated = (list) =>
      list.filter(b => b.rating > 4)
          .sort((a, b) => b.rating - a.rating);

    // ---------- MAIN ----------
    console.log("===== ЗАВДАННЯ 3 =====\n");
    console.log("Середня зарплата: " + averageSalary(employees) + " грн");
    console.log("Найдосвідченіший: " + mostExperienced(employees));

    console.log("\n===== ЗАВДАННЯ 4 =====\n");
    console.log("Непрочитані книги:");
    unreadBooks(books).forEach(t => console.log("  - " + t));

    console.log("\nКниги Robert C. Martin (за роком):");
    booksByAuthor(books, "Robert C. Martin").forEach(b => console.log("  " + b));

    console.log("\nТоп книги (рейтинг > 4):");
    topRated(books).forEach(b => console.log("  " + b));
  </script>
</body>
</html>
