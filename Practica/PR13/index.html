<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина іграшок — Практична робота</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 id="page-title">🧸 Магазин дитячих іграшок</h1>
    <div class="cart-icon-wrap" onclick="openCart()" title="Корзина">
      🛒
      <span id="cart-count">0</span>
    </div>
  </header>

  <div class="container" id="products-page">
    <!-- Тільки обгортка для карток товарів (згідно завдання) -->
    <div class="products-grid" id="products-grid">
      <div class="loading">Завантаження товарів...</div>
    </div>
  </div>

  <div class="container cart-page" id="cart-page">
    <h2 style="margin-bottom: 20px;">Ваша корзина</h2>
    <div id="cart-content"></div>
  </div>

  <!-- Модалка: пуста корзина -->
  <div class="modal-overlay" id="modal-empty">
    <div class="modal">
      <h3>Корзина пуста</h3>
      <p style="margin-bottom: 20px;">Додайте іграшки, щоб продовжити</p>
      <button class="btn-modal btn-primary" onclick="closeModal('modal-empty')">Зрозуміло</button>
    </div>
  </div>

  <!-- Модалка: кількість -->
  <div class="modal-overlay" id="modal-qty">
    <div class="modal">
      <h3>Вкажіть кількість:</h3>
      <input type="number" id="qty-input" min="1" value="1">
      <div class="modal-buttons">
        <button class="btn-modal btn-primary" onclick="confirmAddToCart()">Додати до корзини</button>
        <button class="btn-modal btn-secondary" onclick="closeModal('modal-qty')">Скасувати</button>
      </div>
    </div>
  </div>

  <!-- Модалка: товар додано -->
  <div class="modal-overlay" id="modal-added">
    <div class="modal">
      <h3>Товар додано</h3>
      <p style="margin-bottom: 20px;">Іграшку успішно додано до корзини</p>
      <div class="modal-buttons">
        <button class="btn-modal btn-primary" onclick="goToCart()">Перейти у корзину</button>
        <button class="btn-modal btn-secondary" onclick="closeModal('modal-added')">Повернутись до покупок</button>
      </div>
    </div>
  </div>

  <script>
    // ========== ДАНІ ЗАВАНТАЖУЮТЬСЯ З JSON ==========
    let products = [];
    let cart = [];
    let currentProductId = null;

    // Правильний RAW URL (не blob!)
    const JSON_URL = 'https://raw.githubusercontent.com/Romanif715/roman.github.io/main/Practica/PR13/products.json';

    async function loadProducts() {
      const grid = document.getElementById('products-grid');
      try {
        const response = await fetch(JSON_URL);
        if (!response.ok) {
          throw new Error(`Помилка завантаження: ${response.status}`);
        }
        const data = await response.json();

        // Встановлюємо заголовок сторінки з JSON
        if (data.title) {
          document.getElementById('page-title').textContent = '🧸 ' + data.title;
          document.title = data.title + ' — Практична робота';
        }

        products = data.products || [];
        renderProducts();
        updateCartCount();
      } catch (error) {
        console.error(error);
        grid.innerHTML = `
          <div class="error">
            Не вдалося завантажити товари.<br>
            Перевірте шлях до файлу <code>products.json</code> та чи запущено сторінку через сервер (не через file://).<br>
            <small>${error.message}</small>
          </div>`;
      }
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      if (!products.length) {
        grid.innerHTML = '<div class="empty-cart">Товарів не знайдено</div>';
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-img">${p.image || '🧸'}</div>
          <div class="product-info">
            <div class="product-category">${p.category}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-description">${p.description || ''}</div>
            <div class="product-price">${p.price} грн</div>
            <button class="btn btn-add" onclick="openQtyModal(${p.id})">
              У корзину
            </button>
          </div>
        </div>
      `).join('');
    }

    function updateCartCount() {
      document.getElementById('cart-count').textContent = cart.length;
    }

    function openCart() {
      if (cart.length === 0) {
        showModal('modal-empty');
      } else {
        goToCart();
      }
    }

    function goToCart() {
      closeAllModals();
      document.getElementById('products-page').style.display = 'none';
      document.getElementById('cart-page').style.display = 'block';
      renderCart();
    }

    function goToProducts() {
      document.getElementById('cart-page').style.display = 'none';
      document.getElementById('products-page').style.display = 'block';
    }

    function showModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function closeAllModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    }

    function openQtyModal(productId) {
      currentProductId = productId;
      document.getElementById('qty-input').value = 1;
      showModal('modal-qty');
    }

    function confirmAddToCart() {
      const qty = parseInt(document.getElementById('qty-input').value);
      if (!qty || qty < 1) {
        alert('Вкажіть коректну кількість (мінімум 1)');
        return;
      }

      const product = products.find(p => p.id === currentProductId);
      if (!product) return;

      const existing = cart.find(item => item.id === product.id);

      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: product.price,
          qty: qty
        });
      }

      updateCartCount();
      closeModal('modal-qty');
      showModal('modal-added');
    }

    function renderCart() {
      const content = document.getElementById('cart-content');

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="empty-cart">
            Корзина пуста<br>
            <button class="btn btn-back" style="margin-top:20px" onclick="goToProducts()">
              Повернутись до покупок
            </button>
          </div>`;
        return;
      }

      let total = 0;
      let rows = cart.map((item, index) => {
        const sum = item.price * item.qty;
        total += sum;
        return `
          <tr>
            <td>${index + 1}</td>
            <td>${item.name}</td>
            <td>${item.price.toFixed(2)}</td>
            <td>
              <input type="number" class="qty-input" min="1" value="${item.qty}"
                     onchange="changeQty(${item.id}, this.value)">
            </td>
            <td>${sum.toFixed(2)}</td>
            <td>
              <button class="btn btn-delete" onclick="removeItem(${item.id})">видалити</button>
            </td>
          </tr>
        `;
      }).join('');

      content.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>№</th>
              <th>Назва товару</th>
              <th>Ціна за од.</th>
              <th>К-сть</th>
              <th>Сума</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            <tr style="font-weight:700; background:#fce4ec;">
              <td colspan="4" style="text-align:right;">Разом до оплати:</td>
              <td colspan="2">${total.toFixed(2)} грн.</td>
            </tr>
          </tbody>
        </table>

        <div class="cart-actions">
          <button class="btn btn-back" onclick="goToProducts()">Повернутись до покупок</button>
          <button class="btn btn-pay" onclick="pay()">Оплатити</button>
        </div>
      `;
    }

    function changeQty(id, newQty) {
      newQty = parseInt(newQty);
      if (!newQty || newQty < 1) newQty = 1;

      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty = newQty;
        renderCart();
      }
    }

    function removeItem(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartCount();
      renderCart();
    }

    function pay() {
      if (cart.length === 0) return;
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      alert(`Дякуємо за замовлення!\nСума до сплати: ${total.toFixed(2)} грн.\nГарних покупок! 🧸`);
      cart = [];
      updateCartCount();
      goToProducts();
    }

    // Запуск: завантажуємо дані з JSON
    loadProducts();
  </script>
</body>
</html>
