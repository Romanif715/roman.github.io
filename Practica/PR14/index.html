<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин дитячих іграшок</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Додаткові стилі для модалки вибору мови */
    .lang-modal .modal { max-width: 420px; }
    .lang-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .lang-btn {
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 10px;
      border: 2px solid #e91e63;
      background: white;
      color: #e91e63;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      min-width: 140px;
    }
    .lang-btn:hover {
      background: #e91e63;
      color: white;
    }
    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 16px;
    }
    .lang-switcher select {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      background: rgba(255,255,255,0.2);
      color: white;
      font-weight: 600;
    }
    .lang-switcher select option {
      color: #333;
      background: white;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-right {
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="page-title">🧸 Магазин дитячих іграшок</h1>
    <div class="header-right">
      <div class="lang-switcher">
        <select id="lang-select" onchange="changeLanguage(this.value)">
          <option value="uk">UA</option>
          <option value="en">EN</option>
        </select>
      </div>
      <div class="cart-icon-wrap" onclick="openCart()" title="Cart">
        🛒
        <span id="cart-count">0</span>
      </div>
    </div>
  </header>

  <div class="container" id="products-page">
    <div class="products-grid" id="products-grid">
      <div class="loading" id="loading-text">Завантаження товарів...</div>
    </div>
  </div>

  <div class="container cart-page" id="cart-page">
    <h2 id="cart-title" style="margin-bottom: 20px;">Ваша корзина</h2>
    <div id="cart-content"></div>
  </div>

  <!-- Модалка вибору мови (перший візит) -->
  <div class="modal-overlay lang-modal" id="modal-lang">
    <div class="modal">
      <h3 id="lang-modal-title">Оберіть мову</h3>
      <p id="lang-modal-text" style="margin-bottom: 10px;">Виберіть мову для перегляду магазину</p>
      <div class="lang-buttons">
        <button class="lang-btn" onclick="selectLanguage('uk')">Українська</button>
        <button class="lang-btn" onclick="selectLanguage('en')">English</button>
      </div>
    </div>
  </div>

  <!-- Модалка: пуста корзина -->
  <div class="modal-overlay" id="modal-empty">
    <div class="modal">
      <h3 id="empty-title">Корзина пуста</h3>
      <p id="empty-text" style="margin-bottom: 20px;">Додайте іграшки, щоб продовжити</p>
      <button class="btn-modal btn-primary" id="btn-understood" onclick="closeModal('modal-empty')">Зрозуміло</button>
    </div>
  </div>

  <!-- Модалка: кількість -->
  <div class="modal-overlay" id="modal-qty">
    <div class="modal">
      <h3 id="qty-title">Вкажіть кількість:</h3>
      <input type="number" id="qty-input" min="1" value="1">
      <div class="modal-buttons">
        <button class="btn-modal btn-primary" id="btn-add-cart" onclick="confirmAddToCart()">Додати до корзини</button>
        <button class="btn-modal btn-secondary" id="btn-cancel" onclick="closeModal('modal-qty')">Скасувати</button>
      </div>
    </div>
  </div>

  <!-- Модалка: товар додано -->
  <div class="modal-overlay" id="modal-added">
    <div class="modal">
      <h3 id="added-title">Товар додано</h3>
      <p id="added-text" style="margin-bottom: 20px;">Іграшку успішно додано до корзини</p>
      <div class="modal-buttons">
        <button class="btn-modal btn-primary" id="btn-go-cart" onclick="goToCart()">Перейти у корзину</button>
        <button class="btn-modal btn-secondary" id="btn-continue" onclick="closeModal('modal-added')">Повернутись до покупок</button>
      </div>
    </div>
  </div>

  <script>
    // ========== i18n + КОРЗИНА ==========
    let currentLang = localStorage.getItem('shop_lang') || null;
    let translations = {};
    let products = [];
    let cart = [];
    let currentProductId = null;

  
    const BASE = ''; // якщо все в одній папці
const PRODUCTS_URL = 'https://raw.githubusercontent.com/Romanif715/roman.github.io/main/Practica/PR14/products.json';
const LOCALES_URL = 'https://raw.githubusercontent.com/Romanif715/roman.github.io/main/Practica/PR14/locales/';

    // ========== МОВА ==========
    async function loadTranslations(lang) {
      try {
        const res = await fetch(LOCALES_URL + lang + '.json');
        if (!res.ok) throw new Error('Locale not found');
        translations = await res.json();
        applyTranslations();
      } catch (e) {
        console.error('Failed to load locale:', e);
        // fallback
        translations = {};
      }
    }

    function t(key) {
      return translations[key] || key;
    }

    function applyTranslations() {
      // Заголовок
      document.getElementById('page-title').textContent = '🧸 ' + t('pageTitle');
      document.title = t('pageTitle');

      // Корзина
      document.getElementById('cart-title').textContent = t('cartTitle');

      // Модалки
      document.getElementById('empty-title').textContent = t('emptyCartTitle');
      document.getElementById('empty-text').textContent = t('emptyCartText');
      document.getElementById('btn-understood').textContent = t('understood');

      document.getElementById('qty-title').textContent = t('specifyQty');
      document.getElementById('btn-add-cart').textContent = t('addToCartBtn');
      document.getElementById('btn-cancel').textContent = t('cancel');

      document.getElementById('added-title').textContent = t('itemAddedTitle');
      document.getElementById('added-text').textContent = t('itemAddedText');
      document.getElementById('btn-go-cart').textContent = t('goToCart');
      document.getElementById('btn-continue').textContent = t('continueShopping');

      // Селектор мови
      document.getElementById('lang-select').value = currentLang;

      // Оновлюємо товари і корзину
      if (products.length) renderProducts();
      if (document.getElementById('cart-page').style.display === 'block') {
        renderCart();
      }
    }

    function selectLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('shop_lang', lang);
      closeModal('modal-lang');
      initApp();
    }

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('shop_lang', lang);
      loadTranslations(lang).then(() => {
        // перезавантажуємо товари з новою мовою
        renderProducts();
        if (document.getElementById('cart-page').style.display === 'block') {
          renderCart();
        }
      });
    }

    // ========== ТОВАРИ ==========
    async function loadProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = `<div class="loading">${t('loading')}</div>`;

      try {
        const response = await fetch(PRODUCTS_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        products = data.products || [];
        renderProducts();
        updateCartCount();
      } catch (error) {
        console.error(error);
        grid.innerHTML = `
          <div class="error">
            ${t('loadError')}<br>
            <small>${error.message}</small>
          </div>`;
      }
    }

    function getLocalized(obj) {
      if (!obj) return '';
      if (typeof obj === 'string') return obj;
      return obj[currentLang] || obj['uk'] || obj['en'] || '';
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      if (!products.length) {
        grid.innerHTML = `<div class="empty-cart">${t('noProducts')}</div>`;
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-img">${p.image || '🧸'}</div>
          <div class="product-info">
            <div class="product-category">${getLocalized(p.category)}</div>
            <div class="product-name">${getLocalized(p.name)}</div>
            <div class="product-description">${getLocalized(p.description)}</div>
            <div class="product-price">${p.price} ${t('currency')}</div>
            <button class="btn btn-add" onclick="openQtyModal(${p.id})">
              ${t('addToCart')}
            </button>
          </div>
        </div>
      `).join('');
    }

    // ========== КОРЗИНА ==========
    function updateCartCount() {
      document.getElementById('cart-count').textContent = cart.length;
    }

    function openCart() {
      if (cart.length === 0) {
        showModal('modal-empty');
      } else {
        goToCart();
      }
    }

    function goToCart() {
      closeAllModals();
      document.getElementById('products-page').style.display = 'none';
      document.getElementById('cart-page').style.display = 'block';
      renderCart();
    }

    function goToProducts() {
      document.getElementById('cart-page').style.display = 'none';
      document.getElementById('products-page').style.display = 'block';
    }

    function showModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function closeAllModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    }

    function openQtyModal(productId) {
      currentProductId = productId;
      document.getElementById('qty-input').value = 1;
      showModal('modal-qty');
    }

    function confirmAddToCart() {
      const qty = parseInt(document.getElementById('qty-input').value);
      if (!qty || qty < 1) {
        alert('Min 1');
        return;
      }

      const product = products.find(p => p.id === currentProductId);
      if (!product) return;

      const existing = cart.find(item => item.id === product.id);

      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          id: product.id,
          name: product.name,       // зберігаємо об'єкт з перекладами
          price: product.price,
          qty: qty
        });
      }

      updateCartCount();
      closeModal('modal-qty');
      showModal('modal-added');
    }

    function renderCart() {
      const content = document.getElementById('cart-content');

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="empty-cart">
            ${t('emptyCartTitle')}<br>
            <button class="btn btn-back" style="margin-top:20px" onclick="goToProducts()">
              ${t('backToShopping')}
            </button>
          </div>`;
        return;
      }

      let total = 0;
      let rows = cart.map((item, index) => {
        const sum = item.price * item.qty;
        total += sum;
        return `
          <tr>
            <td>${index + 1}</td>
            <td>${getLocalized(item.name)}</td>
            <td>${item.price.toFixed(2)}</td>
            <td>
              <input type="number" class="qty-input" min="1" value="${item.qty}"
                     onchange="changeQty(${item.id}, this.value)">
            </td>
            <td>${sum.toFixed(2)}</td>
            <td>
              <button class="btn btn-delete" onclick="removeItem(${item.id})">${t('delete')}</button>
            </td>
          </tr>
        `;
      }).join('');

      content.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>${t('tableNum')}</th>
              <th>${t('tableName')}</th>
              <th>${t('tablePrice')}</th>
              <th>${t('tableQty')}</th>
              <th>${t('tableSum')}</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            <tr style="font-weight:700; background:#fce4ec;">
              <td colspan="4" style="text-align:right;">${t('totalToPay')}</td>
              <td colspan="2">${total.toFixed(2)} ${t('currency')}</td>
            </tr>
          </tbody>
        </table>

        <div class="cart-actions">
          <button class="btn btn-back" onclick="goToProducts()">${t('backToShopping')}</button>
          <button class="btn btn-pay" onclick="pay()">${t('pay')}</button>
        </div>
      `;
    }

    function changeQty(id, newQty) {
      newQty = parseInt(newQty);
      if (!newQty || newQty < 1) newQty = 1;
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty = newQty;
        renderCart();
      }
    }

    function removeItem(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartCount();
      renderCart();
    }

    function pay() {
      if (cart.length === 0) return;
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      alert(`${t('thankYou')}\n${t('amountToPay')} ${total.toFixed(2)} ${t('currency')}.\n${t('happyShopping')} 🧸`);
      cart = [];
      updateCartCount();
      goToProducts();
    }

    // ========== СТАРТ ==========
    async function initApp() {
      await loadTranslations(currentLang);
      await loadProducts();
    }

    // Перевіряємо, чи є збережена мова
    if (!currentLang) {
      // Перший візит — показуємо модалку вибору мови
      showModal('modal-lang');
    } else {
      initApp();
    }
  </script>
</body>
</html>
