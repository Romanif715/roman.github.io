<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      padding: 28px 20px 16px;
      font-size: 32px;
      color: #333;
      font-weight: 700;
    }

    .controls {
      padding: 0 24px 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls button {
      flex: 1;
      min-width: 120px;
      padding: 8px 14px;
      border: 2px solid #667eea;
      background: #fff;
      color: #667eea;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .controls button:hover,
    .controls button.active {
      background: #667eea;
      color: #fff;
    }

    .input-wrap {
      padding: 0 24px 20px;
    }

    #taskInput {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    #taskInput:focus {
      border-color: #667eea;
    }

    #taskList {
      list-style: none;
      padding: 0 24px 28px;
      max-height: 420px;
      overflow-y: auto;
    }

    #taskList:empty::after {
      content: 'Немає завдань. Додайте перше!';
      display: block;
      text-align: center;
      color: #aaa;
      padding: 30px 0;
      font-size: 15px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 10px;
      transition: all 0.2s;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover {
      background: #f0f2f5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .task-item.done {
      background: #f0f0f0;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .task-item.done .task-date {
      color: #bbb;
    }

    /* Checkbox */
    .task-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
      flex-shrink: 0;
    }

    .task-item.done .task-checkbox {
      display: none;
    }

    .task-content {
      flex: 1;
      min-width: 0;
      cursor: default;
    }

    .task-text {
      font-size: 15px;
      color: #333;
      word-break: break-word;
      line-height: 1.4;
    }

    .task-date {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    /* Edit input */
    .edit-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 15px;
      border: 2px solid #667eea;
      border-radius: 6px;
      outline: none;
    }

    /* Delete button */
    .delete-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: #e74c3c;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      line-height: 1;
    }

    .delete-btn:hover {
      background: #e74c3c;
      color: #fff;
    }

    .stats {
      text-align: center;
      padding: 0 24px 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ToDo List</h1>

    <div class="controls">
      <button id="btnAll" class="active" onclick="setFilter('all')">Усі</button>
      <button id="btnActive" onclick="setFilter('active')">Невиконані</button>
      <button id="btnDone" onclick="setFilter('done')">Виконані</button>
    </div>

    <div class="input-wrap">
      <input type="text" id="taskInput" placeholder="Додайте завдання" autocomplete="off">
    </div>

    <ul id="taskList"></ul>

    <div class="stats" id="stats"></div>
  </div>

  <script>
    // ===== Data =====
    let tasks = JSON.parse(localStorage.getItem('todoTasks')) || [];
    let currentFilter = 'all';

    // ===== Helpers =====
    function save() {
      localStorage.setItem('todoTasks', JSON.stringify(tasks));
    }

    function formatDate(ts) {
      const d = new Date(ts);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = String(d.getFullYear()).slice(-2);
      const hours = String(d.getHours()).padStart(2, '0');
      const mins = String(d.getMinutes()).padStart(2, '0');
      return `${day}.${month}.${year}, ${hours}:${mins}`;
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // ===== Render =====
    function render() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      let filtered = tasks;
      if (currentFilter === 'active') filtered = tasks.filter(t => !t.done);
      if (currentFilter === 'done') filtered = tasks.filter(t => t.done);

      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;

        // Checkbox (only if not done)
        if (!task.done) {
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'task-checkbox';
          cb.addEventListener('change', () => completeTask(task.id));
          li.appendChild(cb);
        }

        // Content
        const content = document.createElement('div');
        content.className = 'task-content';

        const textEl = document.createElement('div');
        textEl.className = 'task-text';
        textEl.textContent = task.text;

        const dateEl = document.createElement('div');
        dateEl.className = 'task-date';
        dateEl.textContent = formatDate(task.createdAt);

        content.appendChild(textEl);
        content.appendChild(dateEl);

        // Double-click to edit
        content.addEventListener('dblclick', () => startEdit(li, task));

        li.appendChild(content);

        // Delete button
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '✕';
        delBtn.title = 'Видалити';
        delBtn.addEventListener('click', () => deleteTask(task.id));
        li.appendChild(delBtn);

        list.appendChild(li);
      });

      // Stats
      const total = tasks.length;
      const done = tasks.filter(t => t.done).length;
      document.getElementById('stats').textContent =
        total === 0 ? '' : `Всього: ${total} | Виконано: ${done} | Залишилось: ${total - done}`;
    }

    // ===== Actions =====
    function addTask(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      tasks.unshift({
        id: generateId(),
        text: trimmed,
        done: false,
        createdAt: Date.now()
      });
      save();
      render();
    }

    function completeTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.done = true;
        save();
        render();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function startEdit(li, task) {
      const content = li.querySelector('.task-content');
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'edit-input';
      input.value = task.text;

      // Replace content with input
      li.replaceChild(input, content);
      input.focus();
      input.select();

      const finish = () => {
        const newText = input.value.trim();
        if (newText && newText !== task.text) {
          task.text = newText;
          save();
        }
        render();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          finish();
        }
        if (e.key === 'Escape') {
          render();
        }
      });

      input.addEventListener('blur', finish);
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      if (filter === 'all') document.getElementById('btnAll').classList.add('active');
      if (filter === 'active') document.getElementById('btnActive').classList.add('active');
      if (filter === 'done') document.getElementById('btnDone').classList.add('active');
      render();
    }

    // ===== Events =====
    document.getElementById('taskInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addTask(e.target.value);
        e.target.value = '';
      }
    });

    // Init
    render();
  </script>
</body>
</html>
